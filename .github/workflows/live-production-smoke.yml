name: Smoke público — Barber OS primeiro cliente

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/live-production-smoke.yml"
      - "src/pages/Auth.tsx"
      - "src/pages/AuthV2.tsx"
      - "src/convex/**"
      - "src/lib/**"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    name: HTTPS, rota login e bundle de produção
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validar HTTP público sem login ou dados reais
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://barber-os-cliente.pages.dev"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "${BASE}/" -o /tmp/barber-root.html
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "${BASE}/auth" -o /tmp/barber-auth.html
          grep -Fq '<div id="root"></div>' /tmp/barber-root.html
          grep -Fq '<div id="root"></div>' /tmp/barber-auth.html
          grep -Fq '<title>Barber OS</title>' /tmp/barber-root.html
          JS_PATH=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/barber-root.html | head -n 1 | sed -E 's/^src="([^"]+)"$/\1/')
          test -n "$JS_PATH"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "${BASE}${JS_PATH}" -o /tmp/barber-entry.js
          test -s /tmp/barber-entry.js
          echo "OK: site, rota /auth e bundle JS publicados sob HTTPS."
          STATUS=$(curl --silent --show-error --max-time 30 \
            -o /dev/null -w '%{http_code}' -X POST \
            'https://clever-squid-863.convex.site/internal/manual-auth-code')
          test "$STATUS" = "401"
          echo "OK: endpoint interno não permite acesso anônimo."

      - name: Navegador real — login e recuperação sem credenciais
        shell: bash
        run: |
          python3 -m venv /tmp/barber-browser-qa
          /tmp/barber-browser-qa/bin/pip install --quiet playwright
          /tmp/barber-browser-qa/bin/python -m playwright install chromium --with-deps
          /tmp/barber-browser-qa/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright, expect

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(locale="pt-BR")
              page.goto("https://barber-os-cliente.pages.dev/auth", wait_until="domcontentloaded")
              expect(page.get_by_role("heading", name="Entre na sua barbearia")).to_be_visible(timeout=30000)
              expect(page.get_by_role("button", name="Entrar", exact=True)).to_be_visible()
              expect(page.get_by_role("button", name="Entrar com Google")).to_have_count(0)
              page.get_by_role("button", name="Criar conta").click()
              expect(page.get_by_role("heading", name="Crie sua conta")).to_be_visible()
              expect(page.get_by_text("solicite o código de ativação ao suporte", exact=False)).to_be_visible()
              page.get_by_role("button", name="Voltar para entrar").click()
              page.get_by_role("button", name="Esqueci minha senha").click()
              expect(page.get_by_role("heading", name="Recuperar senha")).to_be_visible()
              expect(page.get_by_text("Solicite ao suporte a recuperação de senha", exact=False)).to_be_visible()
              mobile = browser.new_page(viewport={"width": 390, "height": 844}, locale="pt-BR")
              mobile.goto("https://barber-os-cliente.pages.dev/auth", wait_until="domcontentloaded")
              expect(mobile.get_by_role("heading", name="Entre na sua barbearia")).to_be_visible(timeout=30000)
              browser.close()
              print("PASS: interface real de autenticação, recuperação e viewport móvel.")
          PY
